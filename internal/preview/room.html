<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>uEcho / Room display</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#111;font-family:Arial,Helvetica,sans-serif;font-weight:800}main{width:800px;height:480px;background:#f7f6f2;padding:24px;display:grid;grid-template-rows:64px 1fr 50px;gap:14px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;border-bottom:5px solid #111}h1{font-size:36px;letter-spacing:-2px;margin:0}.tag{font-size:11px;letter-spacing:2px}section{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.temperature{border:5px solid #111;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.temperature strong{font-size:92px;letter-spacing:-7px;line-height:1}.temperature span{font-size:16px;letter-spacing:2px}.devices{display:grid;grid-template-rows:1fr 1fr;gap:14px}.card{border-top:5px solid #111;padding:8px 0;display:grid;grid-template-columns:1fr auto;align-items:start}.card h2{font-size:23px;margin:0}.power{background:#111;color:#fff;padding:5px 10px;font-size:18px}.value{grid-column:1/-1;font-size:39px;letter-spacing:-1px}.sub{font-size:12px;letter-spacing:1px}footer{border-top:3px solid #111;padding-top:7px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:3px}#connection{grid-column:1/-1}.muted{opacity:.6}@media(max-width:799px){main{transform-origin:top left;transform:scale(calc(100vw / 800px))}}
</style><main><header><div><div class="tag">UECHO / READ ONLY</div><h1>LIVING ROOM</h1></div><div class="tag">800 × 480<br>ROOM / 01</div></header><section><div class="temperature"><span>ROOM TEMPERATURE</span><strong id="temp">—</strong><span>°C / SENSOR</span></div><div class="devices"><div class="card"><h2>LIGHT</h2><span class="power" id="lightPower">—</span><div class="value" id="brightness">—</div><div class="sub">CEILING / BRIGHTNESS</div></div><div class="card"><h2>AIRCON</h2><span class="power" id="acPower">—</span><div class="value" id="target">—</div><div class="sub" id="mode">—</div></div></div></section><footer><div id="connection">DISPLAY CONNECTING / NO DATA YET</div><div id="received">CONTROLLER: NOT RECEIVED</div><div id="updated">STATE: INITIAL / NOT UPDATED</div></footer></main>
<script>
const text=(id,value)=>document.getElementById(id).textContent=value;
let revision=0,source=new EventSource('/events');
source.onopen=()=>text('connection','DISPLAY STREAM OPEN / WAITING FOR SNAPSHOT');
source.onerror=()=>text('connection','DISPLAY DISCONNECTED / LAST VALUES RETAINED / RECONNECTING');
source.onmessage=event=>{const data=JSON.parse(event.data),s=data.snapshot;revision=s.revision;text('connection',`DISPLAY LIVE / REV ${revision} / ${data.udpAddress?'UDP '+data.udpAddress:'CONTROLLER INPUT DISABLED'}`);text('temp',(s.ambientTenths/10).toFixed(1));for(const d of s.devices){if(d.kind==='light'){text('lightPower',d.power?'ON':'OFF');text('brightness',d.level+'%')}if(d.kind==='aircon'){text('acPower',d.power?'ON':'OFF');text('target',d.target+' °C');text('mode',d.mode.toUpperCase()+' / SETPOINT')}}text('received',s.lastReceived?'LAST RX: '+new Date(s.lastReceived).toLocaleString():'CONTROLLER: NOT RECEIVED');text('updated',s.lastUpdated?'STATE UPDATED: '+new Date(s.lastUpdated).toLocaleString():'STATE: INITIAL / NOT UPDATED')};
</script></html>
